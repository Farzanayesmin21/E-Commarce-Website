<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products - MyShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .product-card { transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-5px); }
    .rating { color: #ffbf00; font-size: 1.1rem; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">
      <img src="images/logo.png" alt="Logo" class="nav-logo">
    </a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
      <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
      <li class="nav-item">
        <a class="nav-link" href="cart.html">
          Cart <span id="cartCount" class="badge bg-warning text-dark">0</span>
        </a>
      </li>
    </ul>
  </div>
</nav>

<!-- PRODUCTS -->
<div class="container my-5">
  <h2 class="text-center mb-4">Our Products</h2>
  <div class="row gx-3 gy-4 justify-content-center" id="products-container"></div>
</div>

<script>
const products = [
  { id: 1, name: "Laptop", price: 50000, rating: "★★★★★", image: "images/product1.jpg", description: "High-performance laptop for gaming and professional use." },
  { id: 2, name: "Tablet", price: 4500, rating: "★★★★☆", image: "images/product2.jpg", description: "Lightweight tablet for daily use." },
  { id: 3, name: "Smart Phone", price: 4000, rating: "★★★★☆", image: "images/product3.jpg", description: "Latest smartphone with strong battery." },
  { id: 4, name: "Wireless Mouse", price: 1000, rating: "★★★☆☆", image: "images/product4.webp", description: "Smooth wireless mouse." },
  { id: 5, name: "Wireless Headphone", price: 2200, rating: "★★★★★", image: "images/product5.jpg", description: "Noise cancelling headphone." },
  { id: 6, name: "Smart Watch", price: 2500, rating: "★★★★☆", image: "images/product6.jpg", description: "Fitness tracking smart watch." },
  { id: 7, name: "Earphone", price: 500, rating: "★★★★☆", image: "images/product7.avif", description: "Clear sound earphone." },
  { id: 8, name: "Gaming Remote", price: 5000, rating: "★★★★★", image: "images/product8.jpg", description: "Professional gaming controller." },
  { id: 9, name: "Airpods", price: 2200, rating: "★★★★☆", image: "images/product9.jpg", description: "True wireless airpods." },
  { id: 10, name: "CCTV Camera", price: 4500, rating: "★★★★☆", image: "images/product10.jpg", description: "Security surveillance camera." },
  { id: 11, name: "Camera", price: 1800, rating: "★★★★★", image: "images/product11.jpg", description: "DSLR professional camera." },
  { id: 12, name: "Keyboard", price: 2000, rating: "★★★★☆", image: "images/product12.webp", description: "Mechanical RGB keyboard." }
];

const container = document.getElementById("products-container");
const cartCountEl = document.getElementById("cartCount");

// Load cart count on page load
let cart = JSON.parse(localStorage.getItem("cart")) || [];
cartCountEl.innerText = cart.reduce((sum, item) => sum + item.quantity, 0);

// Populate products dynamically
products.forEach(product => {
  const col = document.createElement("div");
  col.className = "col-lg-4 col-md-6 col-12";
  col.innerHTML = `
    <div class="card product-card h-100">
      <img src="${product.image}" class="card-img-top" alt="${product.name}">
      <div class="card-body text-center">
        <h5 style="font-size:22px;font-weight:700;">${product.name}</h5>
        <div class="rating">${product.rating}</div>
        <p class="price">৳ ${product.price}</p>
        <div class="d-flex justify-content-center gap-2 mt-2">
          <button class="btn btn-primary" onclick="addToCart(${product.id})">Add to Cart</button>
          <a href="product-detail.html?id=${product.id}" class="btn btn-secondary">View Details</a>
        </div>
      </div>
    </div>
  `;
  container.appendChild(col);
});

// ===== Add to Cart Function =====
function addToCart(id) {
  const product = products.find(p => p.id === id);
  if (!product) return;

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  const exists = cart.find(item => item.id === id);

  if (exists) {
    exists.quantity += 1;
  } else {
    cart.push({ ...product, quantity: 1 });
  }

  localStorage.setItem("cart", JSON.stringify(cart));

  // Update cart badge
  cartCountEl.innerText = cart.reduce((sum, item) => sum + item.quantity, 0);
  alert("Product added to cart!");
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
