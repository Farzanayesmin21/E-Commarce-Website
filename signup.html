<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow" style="width: 380px;">
    <h3 class="text-center mb-3">Sign Up</h3>

    <div class="mb-3">
      <label>Name</label>
      <input type="text" id="name" class="form-control" placeholder="Enter name">
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input type="email" id="email" class="form-control" placeholder="Enter email">
    </div>

    <div class="mb-3">
      <label>Password</label>
      <input type="password" id="password" class="form-control" placeholder="Enter password">
    </div>

    <button class="btn btn-success w-100" onclick="signup()">Create Account</button>

    <p class="text-center mt-3">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

    <p id="signupMsg" class="text-center mt-2"></p>
  </div>
</div>

<script>
function signup() {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msg = document.getElementById("signupMsg");

  if(name === "" || email === "" || password === "") {
    msg.innerHTML = "<span class='text-danger'>All fields are required</span>";
    return;
  }

  const user = { name, email, password };
  localStorage.setItem("user", JSON.stringify(user));

  msg.innerHTML = "<span class='text-success'>Account created successfully!</span>";

  setTimeout(() => {
    window.location.href = "login.html";
  }, 1000);
}
</script>

</body>
</html>
