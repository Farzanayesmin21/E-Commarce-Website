<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow" style="width: 380px;">
    <h3 class="text-center mb-3">Login</h3>

    <div class="mb-3">
      <label>Email</label>
      <input type="email" id="loginEmail" class="form-control" placeholder="Enter email">
    </div>

    <div class="mb-3">
      <label>Password</label>
      <input type="password" id="loginPassword" class="form-control" placeholder="Enter password">
    </div>

    <button class="btn btn-primary w-100" onclick="login()">Login</button>

    <p class="text-center mt-3">
      Don't have an account?
      <a href="signup.html">Sign Up</a>
    </p>

    <p id="loginMsg" class="text-center mt-2"></p>
  </div>
</div>

<script>
function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  const msg = document.getElementById("loginMsg");

  if(email === "" || password === "") {
    msg.innerHTML = "<span class='text-danger'>All fields are required</span>";
    return;
  }

  const user = JSON.parse(localStorage.getItem("user"));

  if(!user) {
    msg.innerHTML = "<span class='text-danger'>No account found. Please sign up.</span>";
    return;
  }

  if(user.email === email && user.password === password) {
    msg.innerHTML = "<span class='text-success'>Login successful!</span>";
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);
  } else {
    msg.innerHTML = "<span class='text-danger'>Invalid email or password</span>";
  }
}
</script>

</body>
</html>
